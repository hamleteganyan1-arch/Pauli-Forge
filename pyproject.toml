[build-system]
requires = ["setuptools>=78,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "pauliforge"
version = "1.0.0"
description = "Density-only orbital-free DFT research with joint finite-basis Pauli constraints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5,<2.6", "torch>=2.14,<2.15"]

[project.optional-dependencies]
qc = ["pyscf>=2.14,<2.15", "scipy>=1.18,<1.19"]
cert = ["cvxpy>=1.9,<1.10", "scipy>=1.18,<1.19"]
equivariant = ["e3nn>=0.6,<0.7", "scipy>=1.18,<1.19"]
ui = ["streamlit>=1.66,<1.67", "plotly>=7.1,<7.2"]
test = ["pytest>=9.1,<9.2"]
dev = ["ruff>=0.17,<0.18", "build>=1.6,<1.7", "setuptools>=78,<85", "wheel>=0.45,<1"]

[project.scripts]
pauliforge = "pauliforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "qc: optional real PySCF integration",
    "slow: optional expensive integration or refinement",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
